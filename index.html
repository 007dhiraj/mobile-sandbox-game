<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile Sandbox</title><style>body{font:16px system-ui;background:#18202c;color:#fff;margin:0;text-align:center}header{padding:16px}#grid{display:grid;grid-template-columns:repeat(12,min(7vw,40px));justify-content:center;gap:2px;margin:12px auto}.tile{width:min(7vw,40px);aspect-ratio:1;border:0;border-radius:3px;padding:0;background:#6db34e}.water{background:#3b94cf}.sand{background:#d5bd78}.stone{background:#777}.tree{background:#25613a}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px}button{padding:12px;border-radius:9px;border:0;font:inherit}#status{padding:10px}</style><header><h1>Mobile Sandbox</h1><p>Tap a tile to remove it; select a block to place in empty space.</p></header><div id="grid"></div><div class="controls"><button onclick="choose('grass')">Grass</button><button onclick="choose('stone')">Stone</button><button onclick="choose('sand')">Sand</button><button onclick="choose('tree')">Tree</button><button onclick="resetWorld()">New world</button></div><p id="status">Tap any tile to clear it.</p><script>let chosen='grass',world=[];function resetWorld(){world=Array.from({length:96},()=>{let n=Math.random();return n<.13?'water':n<.23?'sand':n<.3?'stone':n<.36?'tree':'grass'});draw()}function choose(t){chosen=t;status.textContent='Selected '+t+'; tap a cleared tile to place'}function tap(i){if(world[i])world[i]='';else world[i]=chosen;draw()}function draw(){grid.innerHTML=world.map((t,i)=>'<button class="tile '+t+'" onclick="tap('+i+')" aria-label="'+(t||'empty')+'"></button>').join('')}resetWorld();</script></html>
