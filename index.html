<!doctype html>
<html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mobile Sandbox - Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#152234;color:#f3f6fb;font:15px system-ui}header{text-align:center;padding:12px 10px 5px}h1{margin:4px;font-size:23px}header p{margin:5px;color:#c5d5e8}.panel{max-width:520px;margin:auto;padding:8px}.stats{display:flex;justify-content:space-between;background:#23354b;border-radius:12px;padding:9px 12px;margin:8px 0;font-size:13px}.world{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;background:#101a28;padding:5px;border-radius:12px;touch-action:manipulation}.tile{aspect-ratio:1;border:0;border-radius:3px;padding:0;position:relative;font-size:clamp(12px,4vw,21px);display:flex;align-items:center;justify-content:center;overflow:hidden}.grass{background:#68a94c}.sand{background:#cdb46d}.stone{background:#777f8a}.tree{background:#277340}.water{background:#358ac2}.dirt{background:#8b6343}.empty{background:#182535;outline:1px dashed #34465a}.player{box-shadow:inset 0 0 0 3px #ffdb57;z-index:2}.toolbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}.tool{background:#2b4058;color:white;padding:8px 10px;border:2px solid transparent;border-radius:9px}.tool.active{border-color:#ffd34d;background:#3d5978}.actions{display:flex;gap:8px}.actions button{flex:1;background:#e6b849;color:#1b2430;font-weight:700;padding:11px;border:0;border-radius:10px}.controls{display:grid;grid-template-columns:repeat(3,55px);grid-template-rows:repeat(2,48px);gap:5px;justify-content:center;margin:10px}.controls button{border:0;border-radius:10px;background:#30475f;color:white;font-size:20px;font-weight:bold}.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}.hint{text-align:center;color:#bacadd;font-size:12px;margin:5px}.footer{display:flex;justify-content:center;gap:7px;margin-bottom:10px}.footer button{background:#26394f;color:white;border:0;border-radius:8px;padding:9px}
</style>
<header><h1>🌍 Mobile Sandbox</h1><p>Explore • Mine • Build</p></header><main class="panel"><div class="stats"><span id="pos">Player: —</span><span id="inv">Inventory: —</span></div><div id="world" class="world" aria-label="Game world"></div><p class="hint">Tap a nearby block to mine it. Choose a block, then Place beside you.</p><div class="toolbar" id="tools"></div><div class="actions"><button onclick="mineMode()">⛏️ Mine</button><button onclick="placeMode()">🧱 Place</button></div><div class="controls"><button class="up" onclick="move(0,-1)">▲</button><button class="left" onclick="move(-1,0)">◀</button><button class="down" onclick="move(0,1)">▼</button><button class="right" onclick="move(1,0)">▶</button></div><div class="footer"><button onclick="newWorld()">🌱 New World</button><button onclick="saveGame()">💾 Save</button><button onclick="loadGame()">↩️ Load</button></div><p id="message" class="hint">Ready! Move around and explore.</p></main>
<script>
const W=12,H=12,types=['grass','dirt','stone','sand','tree'];const emoji={grass:'🌿',dirt:'🟫',stone:'🪨',sand:'🟨',tree:'🌳',water:'🌊'};let map=[],player={x:5,y:5},selected='grass',mode='mine',inventory={grass:10,dirt:5,stone:5,sand:4,tree:2};
function newWorld(){map=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>{let n=Math.random();return n<.07?'water':n<.15?'sand':n<.24?'stone':n<.31?'tree':n<.39?'dirt':'grass'}));player={x:5,y:5};map[5][5]='grass';draw();msg('New world generated. Find blocks and build!')}
function draw(){world.innerHTML='';map.forEach((row,y)=>row.forEach((t,x)=>{let b=document.createElement('button');b.className='tile '+(t||'empty')+((x===player.x&&y===player.y)?' player':'');b.textContent=(x===player.x&&y===player.y)?'🧑':(emoji[t]||'');b.title=t||'Empty';b.onclick=()=>tileTap(x,y);world.appendChild(b)}));pos.textContent='Player: '+(player.x+1)+','+(player.y+1);inv.textContent='🧰 '+types.map(t=>emoji[t]+inventory[t]).join('  ');tools.innerHTML=types.map(t=>'<button class="tool '+(selected===t?'active':'')+'" onclick="selectBlock(\''+t+'\')">'+emoji[t]+' '+t+'</button>').join('')}
function msg(s){message.textContent=s}
function selectBlock(t){selected=t;draw();msg('Selected '+t+'. Place it on an adjacent empty tile.')}
function move(dx,dy){let nx=player.x+dx,ny=player.y+dy;if(nx<0||nx>=W||ny<0||ny>=H){msg('World edge.');return}if(map[ny][nx]==='water'){msg('Water tile—choose another route.');return}player.x=nx;player.y=ny;draw()}
function adjacent(x,y){return Math.abs(x-player.x)+Math.abs(y-player.y)<=1}
function tileTap(x,y){if(x===player.x&&y===player.y){msg('You are here!');return}if(!adjacent(x,y)){msg('Move closer to interact with that block.');return}if(mode==='mine'){let t=map[y][x];if(!t){msg('Nothing to mine here.');return}if(t==='water'){msg('Water cannot be mined in this demo.');return}map[y][x]='';inventory[t]=(inventory[t]||0)+1;draw();msg('Mined '+t+'! Added to inventory.')}else{if(map[y][x]){msg('Tile occupied. Mine it first.');return}if(inventory[selected]<1){msg('No '+selected+' blocks. Mine some first!');return}map[y][x]=selected;inventory[selected]--;draw();msg('Placed '+selected+' block!')}}
function mineMode(){mode='mine';msg('Mining mode: tap a nearby block to collect it.')}
function placeMode(){mode='place';msg('Place mode: tap an adjacent empty tile.')}
function saveGame(){localStorage.setItem('sandboxSave',JSON.stringify({map,player,inventory,selected}));msg('Game saved on this device.')}
function loadGame(){let s=localStorage.getItem('sandboxSave');if(!s){msg('No save yet—tap Save first.');return}let d=JSON.parse(s);map=d.map;player=d.player;inventory=d.inventory;selected=d.selected||'grass';draw();msg('Saved world loaded!')}
newWorld();
</script></html>
